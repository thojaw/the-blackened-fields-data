name: Sync festival data

on:
  pull_request:
    branches: [main]
    paths:
      - "**/festival.json"
  workflow_dispatch: {}

concurrency:
  group: sync-festival-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    # GITHUB_TOKEN can't push to a fork's branch, so skip PRs from forks --
    # version bump and index.json will need to be done by hand for those.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Bump version on changed festival.json files
        run: python3 scripts/bump-festival-version.py --base origin/main

      - name: Regenerate index.json
        run: python3 scripts/generate-index.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Sync festival data (version bump + index regen)"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
